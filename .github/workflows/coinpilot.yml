name: CoinPilot paper cycle

# Runs the Python paper bot on a schedule, keeps its SQLite ledger on a
# "ledger" branch, and publishes the static dashboard to GitHub Pages.
#
# A push to main also runs one cycle, so a change is exercised straight away
# instead of waiting for the cron. The ledger push goes to the "ledger" branch,
# which this trigger ignores, so cycles cannot cascade.
#
# One-time manual steps in the repo:
#   1. Settings -> Pages -> Source: "GitHub Actions"
#   2. Settings -> Variables -> ENABLE_PAGES = on (publishes the dashboard)
#   3. Optional: Settings -> Secrets -> add OPENAI_API_KEY for the LLM analyst
#   4. Kill switch: commit an empty file named KILL to the default branch

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub schedules can be a few minutes late; that is fine here
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: coinpilot-cycle
  cancel-in-progress: false

jobs:
  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 selftest.py

  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore ledger (previous SQLite database)
        run: |
          git fetch origin ledger --depth=1 || true
          if git show-ref --verify -q refs/remotes/origin/ledger; then
            git checkout origin/ledger -- data/coinpilot.db
            echo "ledger restored from origin/ledger"
          else
            echo "no ledger branch yet; starting a fresh paper account"
          fi

      - name: Run one cycle
        id: cycle
        # A flaky feed should not cost us the ledger commit or the dashboard.
        # The run still goes red, below, so failures are visible.
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 main.py once

      - name: Build dashboard
        run: python3 dashboard.py build --db data/coinpilot.db --out dist

      - name: Save ledger back to the ledger branch
        run: |
          git config user.name "coinpilot-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/coinpilot.db /tmp/coinpilot.db
          git fetch origin ledger --depth=1 || true
          if git show-ref --verify -q refs/remotes/origin/ledger; then
            git branch -f ledger origin/ledger
            git switch -f ledger
          else
            git switch --orphan ledger
          fi
          mkdir -p data
          cp /tmp/coinpilot.db data/coinpilot.db
          # -f: the checked-out .gitignore ignores data/ even on this branch
          git add -f data/coinpilot.db
          if git status --porcelain -- data/coinpilot.db | grep -q .; then
            git commit -m "ledger: cycle $(date -u +%FT%TZ)"
            git push origin ledger
          else
            echo "ledger unchanged; nothing to commit"
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist

      - name: Report a failed cycle
        if: steps.cycle.outcome == 'failure'
        run: |
          echo "::error::the paper cycle failed; the ledger and dashboard were still saved"
          exit 1

  pages:
    # The dashboard HTML is always uploaded as the "dashboard" artifact of the
    # cycle job, which needs no extra setup. Publishing a live Pages site also
    # needs the Pages source set to "GitHub Actions" and the ENABLE_PAGES repo
    # variable set to "on"; without the variable this job is skipped and the
    # cycle still succeeds.
    if: vars.ENABLE_PAGES == 'on'
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
