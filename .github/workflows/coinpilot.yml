name: CoinPilot paper cycle

# Runs the Python paper bot on a schedule, keeps its SQLite ledger on a
# "ledger" branch, and publishes the static dashboard to GitHub Pages.
#
# A push to main also runs one cycle, so a change is exercised straight away
# instead of waiting for the cron. The ledger push goes to the "ledger" branch,
# which this trigger ignores, so cycles cannot cascade.
#
# One-time manual steps in the repo:
#   1. Optional: Settings -> Secrets -> add OPENAI_API_KEY for the LLM analyst
#   2. Kill switch: commit an empty file named KILL to the default branch
#
# Pages self-configures (enablement: true), and each cycle also commits the
# built dashboard to the ledger branch as site/index.html, viewable at
# https://raw.githack.com/sera0x/CoinPilot/ledger/site/index.html even if
# Pages is down.

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub schedules can be a few minutes late; that is fine here
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "worker/**"
      - "**.md"

permissions:
  contents: write

concurrency:
  group: coinpilot-cycle
  cancel-in-progress: false

jobs:
  selftest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 selftest.py

  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore ledger (previous SQLite database)
        run: |
          git fetch origin ledger --depth=1 || true
          if git show-ref --verify -q refs/remotes/origin/ledger; then
            git checkout origin/ledger -- data/coinpilot.db
            echo "ledger restored from origin/ledger"
          else
            echo "no ledger branch yet; starting a fresh paper account"
          fi

      - name: Run one cycle
        id: cycle
        # A flaky feed should not cost us the ledger commit or the dashboard.
        # The run still goes red, below, so failures are visible.
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 main.py once

      - name: Build swarm dashboard (React + three.js)
        id: swarm
        continue-on-error: true
        run: |
          cd dashboard
          npm install --no-audit --no-fund
          npm run build

      - name: Static fallback if the swarm build failed
        if: steps.swarm.outcome == 'failure'
        run: python3 dashboard.py build --db data/coinpilot.db --out dist

      - name: Attach data.json feed
        run: |
          mkdir -p dist
          python3 dashboard.py data --db data/coinpilot.db --out dist

      - name: Save ledger + dashboard copy to the ledger branch
        run: |
          git config user.name "coinpilot-bot"
          git config user.email "bot@users.noreply.github.com"
          cp data/coinpilot.db /tmp/coinpilot.db
          mkdir -p /tmp/site && cp dist/index.html dist/data.json /tmp/site/
          git fetch origin ledger --depth=1 || true
          if git show-ref --verify -q refs/remotes/origin/ledger; then
            git branch -f ledger origin/ledger
            git switch -f ledger
          else
            git switch --orphan ledger
          fi
          mkdir -p data site
          cp /tmp/coinpilot.db data/coinpilot.db
          cp /tmp/site/index.html /tmp/site/data.json site/
          # -f: the checked-out .gitignore ignores data/ even on this branch
          git add -f data/coinpilot.db site/index.html site/data.json
          if git status --porcelain | grep -q .; then
            git commit -m "ledger + site: cycle $(date -u +%FT%TZ)"
            git push origin ledger
          else
            echo "ledger unchanged; nothing to commit"
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist

      - name: Report a failed cycle
        if: steps.cycle.outcome == 'failure'
        run: |
          echo "::error::the paper cycle failed; the ledger and dashboard were still saved"
          exit 1

  pages:
    # Self-enabling: configure-pages with enablement: true creates the Pages
    # site with the workflow token if it does not exist yet, so no manual
    # Settings change is needed. If this job ever fails, the dashboard copy on
    # the ledger branch (site/index.html) is the fallback view.
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
